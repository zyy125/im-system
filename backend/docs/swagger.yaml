basePath: /
definitions:
  dto.CheckUserOnlineResp:
    properties:
      online:
        type: boolean
      user_id:
        type: integer
    type: object
  dto.ConversationItemResp:
    properties:
      id:
        type: integer
      last_message:
        $ref: '#/definitions/dto.MessageResp'
      name:
        type: string
      peer:
        $ref: '#/definitions/dto.ConversationPeerResp'
      type:
        $ref: '#/definitions/model.ConversationType'
      unread_count:
        type: integer
    type: object
  dto.ConversationListResp:
    properties:
      conversations:
        items:
          $ref: '#/definitions/dto.ConversationItemResp'
        type: array
    type: object
  dto.ConversationPeerResp:
    properties:
      online:
        type: boolean
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.CreateGroupReq:
    properties:
      member_ids:
        items:
          type: integer
        type: array
      name:
        type: string
    required:
    - name
    type: object
  dto.FriendInfoResp:
    properties:
      conversation_id:
        type: integer
      online:
        type: boolean
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.FriendListResp:
    properties:
      friends:
        items:
          $ref: '#/definitions/dto.FriendInfoResp'
        type: array
    type: object
  dto.FriendRequestItemResp:
    properties:
      id:
        type: integer
      message:
        type: string
      receiver:
        $ref: '#/definitions/dto.FriendRequestUserResp'
      requester:
        $ref: '#/definitions/dto.FriendRequestUserResp'
      status:
        $ref: '#/definitions/model.FriendRequestStatus'
    type: object
  dto.FriendRequestListResp:
    properties:
      requests:
        items:
          $ref: '#/definitions/dto.FriendRequestItemResp'
        type: array
    type: object
  dto.FriendRequestUserResp:
    properties:
      online:
        type: boolean
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.GroupConversationResp:
    properties:
      conversation:
        $ref: '#/definitions/dto.ConversationItemResp'
    type: object
  dto.GroupDetailEnvelopeResp:
    properties:
      group:
        $ref: '#/definitions/dto.GroupDetailResp'
    type: object
  dto.GroupDetailResp:
    properties:
      avatar:
        type: string
      id:
        type: integer
      member_count:
        type: integer
      my_role:
        $ref: '#/definitions/model.ConversationMemberRole'
      name:
        type: string
      owner_id:
        type: integer
      status:
        $ref: '#/definitions/model.ConversationStatus'
    type: object
  dto.GroupMemberListResp:
    properties:
      members:
        items:
          $ref: '#/definitions/dto.GroupMemberResp'
        type: array
    type: object
  dto.GroupMemberResp:
    properties:
      online:
        type: boolean
      user_id:
        type: integer
      role:
        $ref: '#/definitions/model.ConversationMemberRole'
      username:
        type: string
    type: object
  dto.InviteGroupMembersReq:
    properties:
      member_ids:
        items:
          type: integer
        type: array
    required:
    - member_ids
    type: object
  dto.LatestReadStateResp:
    properties:
      latest_sent_seq:
        type: integer
      read_by_user_ids:
        items:
          type: integer
        type: array
      read_count:
        type: integer
    type: object
  dto.MessageHistoryResp:
    properties:
      has_more:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/dto.MessageResp'
        type: array
      next_before_seq:
        type: integer
    type: object
  dto.MessageResp:
    properties:
      content:
        type: string
      conversation_id:
        type: integer
      event:
        $ref: '#/definitions/model.MessageEvent'
      extra:
        type: object
      from_user_id:
        type: integer
      id:
        type: integer
      msg_id:
        type: string
      send_time:
        type: integer
      seq:
        type: integer
      type:
        $ref: '#/definitions/model.MessageType'
    type: object
  dto.MessageSyncResp:
    properties:
      has_more:
        type: boolean
      max_returned_seq:
        type: integer
      messages:
        items:
          $ref: '#/definitions/dto.MessageResp'
        type: array
    type: object
  dto.OpenConversationResp:
    properties:
      conversation:
        $ref: '#/definitions/dto.ConversationItemResp'
      latest_read_state:
        $ref: '#/definitions/dto.LatestReadStateResp'
    type: object
  dto.SendFriendRequestReq:
    properties:
      message:
        type: string
    type: object
  dto.UpdateGroupNameReq:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  dto.UserInfoResp:
    properties:
      online:
        type: boolean
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.UserLoginReq:
    properties:
      password:
        type: string
      user_id:
        type: integer
    required:
    - password
    - user_id
    type: object
  dto.UserLoginResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  dto.UserRefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.UserRefreshResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  dto.UserRegisterReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.UserRegisterResp:
    properties:
      user_id:
        type: integer
    type: object
  model.ConversationMemberRole:
    enum:
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-comments:
      ConversationMemberRoleAdmin: 管理员
      ConversationMemberRoleMember: 普通成员
      ConversationMemberRoleOwner: 群主
    x-enum-descriptions:
    - 群主
    - 管理员
    - 普通成员
    x-enum-varnames:
    - ConversationMemberRoleOwner
    - ConversationMemberRoleAdmin
    - ConversationMemberRoleMember
  model.ConversationStatus:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-comments:
      ConversationStatusActive: 正常
      ConversationStatusDismissed: 已解散（群聊专用）
    x-enum-descriptions:
    - 正常
    - 已解散（群聊专用）
    x-enum-varnames:
    - ConversationStatusActive
    - ConversationStatusDismissed
  model.ConversationType:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-comments:
      ConversationTypeGroup: 群聊
      ConversationTypeSingle: 单聊
    x-enum-descriptions:
    - 单聊
    - 群聊
    x-enum-varnames:
    - ConversationTypeSingle
    - ConversationTypeGroup
  model.FriendRequestStatus:
    enum:
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-comments:
      FriendRequestAccepted: 已同意
      FriendRequestPending: 待处理
      FriendRequestRejected: 已拒绝
    x-enum-descriptions:
    - 待处理
    - 已同意
    - 已拒绝
    x-enum-varnames:
    - FriendRequestPending
    - FriendRequestAccepted
    - FriendRequestRejected
  model.MessageEvent:
    enum:
    - ""
    - group_created
    - group_renamed
    - group_members_joined
    - group_member_removed
    - group_member_left
    - group_dismissed
    type: string
    x-enum-varnames:
    - MessageEventNone
    - MessageEventGroupCreated
    - MessageEventGroupRenamed
    - MessageEventGroupMembersJoined
    - MessageEventGroupMemberRemoved
    - MessageEventGroupMemberLeft
    - MessageEventGroupDismissed
  model.MessageType:
    enum:
    - 1
    - 2
    format: int32
    type: integer
    x-enum-comments:
      MessageTypeSystem: 系统自动生成的事件消息（如建群、改名）
      MessageTypeText: 用户发送的文本消息
    x-enum-descriptions:
    - 用户发送的文本消息
    - 系统自动生成的事件消息（如建群、改名）
    x-enum-varnames:
    - MessageTypeText
    - MessageTypeSystem
  response.Response:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: '单体 IM 后端 API。HTTP 受保护接口只接受 `Authorization: Bearer <token>`；WebSocket
    握手接受 `Authorization: Bearer <token>`，并仅为浏览器兼容保留 `?token=<jwt>`。生产环境要求显式配置 `ws.allowed_origins`，运行配置新增
    `app.http_addr`、`ws.allowed_origins`、`presence.ttl`、`presence.heartbeat_interval`。'
  title: IM System API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: '使用 user_id 和密码登录，返回 access token 和 refresh token。后续 HTTP 受保护接口必须通过
        `Authorization: Bearer <access_token>` 传递。'
      parameters:
      - description: 用户登录请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dto.UserLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserLoginResp'
              type: object
        "400":
          description: 参数校验错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 账号号或密码错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户登录
      tags:
      - 用户
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 用户登出，将当前 Bearer token 的 jti 加入黑名单；普通 HTTP 接口不接受 query token。
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 用户
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用 refresh token 换取新的一组 access/refresh token。
      parameters:
      - description: 刷新 token 请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dto.UserRefreshReq'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserRefreshResp'
              type: object
        "400":
          description: 参数校验错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: refresh token 无效
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 刷新 access token
      tags:
      - 用户
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 用户注册，成功后返回当前账号的 user_id。
      parameters:
      - description: 用户注册请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dto.UserRegisterReq'
      produces:
      - application/json
      responses:
        "201":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserRegisterResp'
              type: object
        "400":
          description: 参数校验错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 用户注册
      tags:
      - 用户
  /api/v1/conversations:
    get:
      description: 获取当前用户可见会话、未读数和最后一条消息摘要
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ConversationListResp'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取会话列表
      tags:
      - 会话
  /api/v1/conversations/{id}/hide:
    post:
      description: 将指定会话从当前用户会话列表中隐藏
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 会话成员不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 隐藏会话
      tags:
      - 会话
  /api/v1/conversations/{id}/open:
    post:
      description: 按会话ID打开会话，不可见会话会自动恢复显示
      parameters:
      - description: 会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 打开成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.OpenConversationResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权访问该会话
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 会话或成员不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 打开会话
      tags:
      - 会话
  /api/v1/conversations/groups:
    get:
      description: 返回当前用户仍为活跃成员的全部群聊，不受消息栏 visible 状态影响
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.ConversationListResp'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取群聊列表
      tags:
      - 会话
    post:
      consumes:
      - application/json
      description: 创建一个群聊并可携带初始成员，member_ids 使用用户 user_id。
      parameters:
      - description: 创建群聊请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGroupReq'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.GroupConversationResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: 群人数超限或状态冲突
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 创建群聊
      tags:
      - 会话
  /api/v1/conversations/groups/{id}:
    get:
      description: 获取指定群聊的基础信息和当前用户角色
      parameters:
      - description: 群会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/dto.GroupDetailEnvelopeResp'
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权访问该群
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 群会话不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 获取群详情
      tags:
      - 会话
  /api/v1/conversations/groups/{id}/dismiss:
    post:
      description: 由群主解散指定群聊
      parameters:
      - description: 群会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限解散
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 群会话不存在
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 解散群聊
      tags:
      - 会话
  /api/v1/conversations/groups/{id}/invite:
    post:
      consumes:
      - application/json
      description: 邀请用户加入指定群聊，member_ids 使用用户 user_id。
      parameters:
      - description: 群会话ID
        in: path
        name: id
        required: true
        type: integer
      - description: 邀请成员请求
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dto.InviteGroupMembersReq'
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限邀请
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 群会话不存在
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: 群人数超限或状态冲突
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 邀请成员入群
      tags:
      - 会话
  /api/v1/conversations/groups/{id}/leave:
    post:
      description: 当前用户主动退出指定群聊
      parameters:
      - description: 群会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 操作成功
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: 无权限退出
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: 群会话不存在
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: 群主不可直接退群
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 内部服务器错误
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 退出群聊
      tags:
      - 会话
  /api/v1/conversations/groups/{id}/members:
    get:
      description: 获取指定群聊的当前活跃成员列表
      parameters:
      - description: 群会话ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
