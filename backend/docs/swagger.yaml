  /api/v1/ws/:
    get:
      description: '建立当前用户的 WebSocket 长连接，用于实时消息与在线状态推送。优先使用 `Authorization: Bearer
        <token>`；浏览器场景可使用 `?token=<jwt>`。生产环境会按 `ws.allowed_origins` 校验 Origin。'
      parameters:
      - description: Bearer JWT，优先使用
        in: header
        name: Authorization
        type: string
      - description: 仅限 WebSocket 握手使用的 JWT query token
        in: query
        name: token
        type: string
      produces:
      - text/plain
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Origin 不在允许列表中
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 升级连接失败
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: 建立 WebSocket 连接
      tags:
      - WebSocket
securityDefinitions:
  BearerAuth:
    description: HTTP 受保护接口必须使用 Bearer Token；WebSocket 握手也支持该 Header。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
