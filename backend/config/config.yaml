jwt:
  secret: "123456"
  access_expiry: 2
  refresh_expiry: 720

app:
  env: "development"
  http_addr: ":8080"

monitor:
  addr: "127.0.0.1:9090"
  enable_metrics: true
  enable_debug_hub: false
  enable_pprof: true

http:
  allowed_origins:
    - "http://localhost:4174"
    - "http://127.0.0.1:4174"

storage:
  avatar_dir: "./storage/avatars"
  avatar_public_base: "/uploads/avatars"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

mysql:
  dsn: "root:123456@tcp(localhost:3306)/im_system?charset=utf8mb4&parseTime=True&loc=Local"

ws:
  allowed_origins:
    - "http://localhost:4174"
    - "http://127.0.0.1:4174"

presence:
  ttl: "90s"
  heartbeat_interval: "30s"
