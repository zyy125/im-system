global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: im-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9090
        labels:
          service: im-backend

  - job_name: redis-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          service: redis

  - job_name: mysql-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - mysql-exporter:9104
        labels:
          service: mysql
